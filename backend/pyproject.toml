[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI_Apostle", email = "achasaviourikhamate@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "cryptography>=45.0.0",
    "pillow>=12.0.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "supabase>=2.34.0",
    "uvicorn>=0.54.0",
    "strands-agents[openai]>=1.64.0",
    "reportlab>=4.4.0",
    "memwal>=0.2.3,<0.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
